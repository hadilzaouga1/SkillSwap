<div class="max-w-6xl mx-auto space-y-8">
  
  <!-- En-tête -->
  <div class="flex justify-between items-center bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100">
    <div>
      <h1 class="text-2xl font-extrabold text-gray-900">Mes Compétences</h1>
      <p class="text-gray-500 text-sm mt-1">Gérez les compétences que vous proposez.</p>
    </div>
    <a routerLink="/competences/nouvelle" 
       class="bg-[#2E3A46] text-white px-6 py-3 rounded-xl font-bold hover:bg-gray-800 transition-all shadow-lg flex items-center gap-2 text-sm">
      + Nouvelle compétence
    </a>
  </div>

  <p *ngIf="loading" class="text-center text-gray-500">Chargement...</p>
  <p *ngIf="erreur" class="text-center text-red-500">{{ erreur }}</p>
  
  <p *ngIf="!loading && competences.length === 0" class="text-center text-gray-500 py-10 bg-white rounded-3xl border border-dashed border-gray-300">
    Vous n'avez encore publié aucune compétence.
  </p>

  <!-- Grille de cartes -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let c of competences" 
         class="bg-white rounded-3xl p-6 border border-gray-100 shadow-sm hover:shadow-xl transition-all group flex flex-col">
      
      <div class="flex justify-between items-start mb-4">
        <span class="bg-gray-100 text-gray-600 text-xs font-bold px-3 py-1 rounded-lg uppercase tracking-wide">
          {{ c.categorie.nom }}
        </span>
        
        <!-- Badge de statut -->
        <span [ngClass]="{
          'bg-orange-100 text-orange-600': c.statutValidation === 'EN_ATTENTE',
          'bg-green-100 text-green-600': c.statutValidation === 'VALIDEE',
          'bg-red-100 text-red-600': c.statutValidation === 'REFUSEE'
        }" class="text-xs font-bold px-3 py-1 rounded-lg flex items-center gap-1">
          {{ libelleStatut(c.statutValidation) }}
        </span>
      </div>

      <h3 class="text-lg font-bold text-gray-900 mb-2">{{ c.titre }}</h3>
      <p class="text-sm text-gray-500 mb-4 line-clamp-2 flex-1">{{ c.description }}</p>
      
      <div class="text-xs font-medium text-gray-400 mb-6 bg-gray-50 p-2 rounded-lg inline-block w-fit">
        Niveau : {{ c.niveau | niveau }}
      </div>

      <div class="flex items-center gap-3 pt-4 border-t border-gray-100 mt-auto">
        <a [routerLink]="['/competences', c.id, 'modifier']" 
           class="flex-1 text-center py-2.5 bg-gray-50 text-gray-700 text-sm font-bold rounded-xl hover:bg-gray-200 transition-colors">
          Modifier
        </a>
        <button (click)="supprimer(c)" 
                class="flex-1 text-center py-2.5 bg-red-50 text-red-600 text-sm font-bold rounded-xl hover:bg-red-100 transition-colors">
          Supprimer
        </button>
      </div>
    </div>
  </div>
</div>
