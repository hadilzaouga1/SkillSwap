<div class="min-h-screen bg-[#F4F7F6] py-10 px-4 flex justify-center items-start">
  <div class="w-full max-w-2xl bg-white rounded-[2rem] shadow-xl shadow-gray-200/50 border border-gray-100 overflow-hidden">

    <!-- En-tête -->
    <div class="bg-gradient-to-r from-[#5B8A72] to-[#4A725D] px-8 py-6 text-white text-center">
      <h2 class="text-2xl font-extrabold tracking-tight">
        {{ modeModification ? 'Modifier la compétence' : 'Publier une nouvelle compétence' }}
      </h2>
      <p class="text-white/80 text-sm mt-1">
        Partagez votre savoir avec la communauté.
      </p>
    </div>

    <!-- Formulaire -->
    <form class="p-8 space-y-6" [formGroup]="form" (ngSubmit)="enregistrer()">

      <p *ngIf="erreur"
         class="bg-red-50 text-red-500 p-4 rounded-xl text-sm font-medium text-center border border-red-100">
        {{ erreur }}
      </p>

      <!-- Titre -->
      <div>
        <label class="text-sm font-bold text-gray-700 mb-2 block">
          Titre de la compétence *
        </label>
        <input
          type="text"
          formControlName="titre"
          placeholder="Ex : Cours d'Anglais conversationnel"
          class="w-full bg-gray-50 border border-gray-200 text-gray-800 text-sm rounded-xl p-3 outline-none"
        />
        <p class="text-red-500 text-xs mt-1" *ngIf="invalide('titre')">
          Le titre est obligatoire.
        </p>
      </div>

      <!-- Catégorie et niveau -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <div>
          <label class="text-sm font-bold text-gray-700 mb-2 block">
            Catégorie *
          </label>
          <select
            formControlName="categorieId"
            class="w-full bg-gray-50 border border-gray-200 text-gray-800 text-sm rounded-xl p-3 outline-none">
            <option [ngValue]="null" disabled>Choisir...</option>
            <option *ngFor="let cat of categories" [ngValue]="cat.id">
              {{ cat.nom }}
            </option>
          </select>
          <p class="text-red-500 text-xs mt-1" *ngIf="invalide('categorieId')">
            Champ requis.
          </p>
        </div>

        <div>
          <label class="text-sm font-bold text-gray-700 mb-2 block">
            Niveau *
          </label>
          <select
            formControlName="niveau"
            class="w-full bg-gray-50 border border-gray-200 text-gray-800 text-sm rounded-xl p-3 outline-none">
            <option [ngValue]="null" disabled>Choisir...</option>
            <option *ngFor="let n of niveaux" [ngValue]="n.valeur">
              {{ n.libelle }}
            </option>
          </select>
          <p class="text-red-500 text-xs mt-1" *ngIf="invalide('niveau')">
            Champ requis.
          </p>
        </div>

      </div>

      <!-- Description -->
      <div>
        <label class="text-sm font-bold text-gray-700 mb-2 block">
          Description
        </label>
        <textarea
          formControlName="description"
          rows="4"
          placeholder="Décrivez ce que vous proposez, ce que l'élève va apprendre..."
          class="w-full bg-gray-50 border border-gray-200 text-gray-800 text-sm rounded-xl p-3 outline-none resize-none">
        </textarea>

        <div class="mt-2 flex flex-wrap items-center gap-3">
          <button
            type="button"
            (click)="assisterDescription()"
            [disabled]="iaEnCours"
            class="text-sm font-bold text-[#5B8A72] hover:underline disabled:opacity-40">
            {{ iaEnCours ? 'L\'IA rédige…' : '✨ ' + (form.value.description ? 'Améliorer avec l\'IA' : 'Générer avec l\'IA') }}
          </button>

          <span *ngFor="let t of iaConseils" class="text-xs text-gray-500">
            💡 {{ t }}
          </span>
        </div>
      </div>

      <!-- Disponibilités -->
      <div>
        <label class="text-sm font-bold text-gray-700 mb-2 block">
          Disponibilités
        </label>
        <input
          type="text"
          formControlName="disponibilites"
          placeholder="Ex : Lundi et Mercredi soir, Weekend..."
          class="w-full bg-gray-50 border border-gray-200 text-gray-800 text-sm rounded-xl p-3 outline-none"
        />
      </div>

      <!-- Support PDF -->
      <div class="bg-gray-50 p-5 rounded-2xl border border-gray-100 space-y-3">
        <label class="text-sm font-bold text-gray-700 block">
          Support de cours associé (PDF 10 Mo max)
        </label>

        <input
          type="file"
          accept="application/pdf,.pdf"
          (change)="choisirPdfCompetence($event)"
          class="block w-full text-sm text-gray-500 file:mr-3 file:rounded-xl file:border-0 file:bg-[#5B8A72]/10 file:px-4 file:py-2.5 file:font-bold file:text-[#4A725D] cursor-pointer"
        />

        <p *ngIf="selectedFile" class="text-sm text-green-700">
          Fichier sélectionné : {{ selectedFile.name }}
        </p>
      </div>

      <!-- Boutons -->
      <div class="pt-4 flex items-center justify-end gap-4 border-t border-gray-100">

        <a
          routerLink="/mes-competences"
          class="px-6 py-3 text-sm font-bold text-gray-500 hover:bg-gray-100 rounded-xl transition-colors">
          Annuler
        </a>

        <!-- CORRECTION ICI : ajout de form.invalid pour désactiver le bouton si le formulaire est incomplet -->
        <button
          type="submit"
          [disabled]="envoiEnCours || form.invalid"
          class="px-8 py-3 bg-[#5B8A72] hover:bg-[#4A725D] text-white text-sm font-bold rounded-xl shadow-lg shadow-[#5B8A72]/30 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
          {{ envoiEnCours ? 'Enregistrement...' : (modeModification ? 'Modifier la compétence' : 'Publier la compétence') }}
        </button>

      </div>

    </form>
  </div>
</div>
