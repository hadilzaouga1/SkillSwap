<div class="container">
  <h1>Inscription</h1>

  <!-- BOÎTE D'ALERTE GLOBALE (s'affiche si on clique sans remplir) -->
  <div class="alerte-globale" *ngIf="alerteSaisie && form.invalid" style="background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; margin-bottom: 15px; border: 1px solid #f5c6cb;">
    <strong>Attention !</strong> Veuillez corriger les champs en rouge avant de continuer.
  </div>

  <form class="form" [formGroup]="form" (ngSubmit)="sInscrire()">
    <p class="erreur" *ngIf="erreur">{{ erreur }}</p>

    <label for="nom">Nom *</label>
    <input id="nom" type="text" formControlName="nom" [class.invalide]="invalide('nom')" />
    <p class="champ-erreur" *ngIf="invalide('nom')">Le nom est obligatoire.</p>

    <label for="email">Email universitaire *</label>
    <input id="email" type="email" formControlName="email" autocomplete="username"
           placeholder="prenom.nom@univ.tn" [class.invalide]="invalide('email')" />
    <p class="champ-erreur" *ngIf="invalide('email')">Saisissez un email valide.</p>

    <label for="motDePasse">Mot de passe * (8 caractères minimum)</label>
    <input id="motDePasse" type="password" formControlName="motDePasse" autocomplete="new-password" [class.invalide]="invalide('motDePasse')" />
    <p class="champ-erreur" *ngIf="invalide('motDePasse')">Le mot de passe doit contenir au moins 8 caractères.</p>

    <label for="confirmation">Confirmer le mot de passe *</label>
    <input id="confirmation" type="password" formControlName="confirmation" autocomplete="new-password" 
           [class.invalide]="invalide('confirmation') || (form.hasError('motsDifferents') && form.get('confirmation')?.touched)" />
    <p class="champ-erreur" *ngIf="form.hasError('motsDifferents') && form.get('confirmation')?.touched">
      Les deux mots de passe ne sont pas identiques.
    </p>

    <label for="universite">Université</label>
    <input id="universite" type="text" formControlName="universite" />

    <label for="filiere">Filière</label>
    <input id="filiere" type="text" formControlName="filiere" />

    <div class="actions">
      <button type="submit" class="btn btn-primary" [disabled]="envoiEnCours">Créer mon compte</button>
    </div>

    <p class="alternative">Déjà inscrit ? <a routerLink="/connexion">Connectez-vous</a></p>
  </form>
</div>
