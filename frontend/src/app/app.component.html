<!-- Barre de navigation : les liens dépendent de la connexion et du rôle -->
<nav class="navbar">
  <a class="logo" routerLink="/">SkillSwap</a>

  <div class="liens">
    <a routerLink="/" routerLinkActive="actif" [routerLinkActiveOptions]="{ exact: true }">Catalogue</a>

    <ng-container *ngIf="auth.estConnecte">
      <a routerLink="/competences/nouvelle" routerLinkActive="actif">Publier</a>
      <a routerLink="/mes-competences" routerLinkActive="actif">Mes compétences</a>
      <a routerLink="/profil/moi" routerLinkActive="actif">Mon profil</a>
      <a *ngIf="auth.estModerateur" routerLink="/moderation/competences" routerLinkActive="actif">Modération</a>
    </ng-container>
  </div>

  <div class="compte">
    <ng-container *ngIf="auth.estConnecte; else visiteur">
      <span class="salut">{{ auth.utilisateur?.nom }} · {{ libelleRole }}</span>
      <button type="button" class="deconnexion" (click)="auth.deconnexion()">Déconnexion</button>
    </ng-container>

    <ng-template #visiteur>
      <a routerLink="/connexion" routerLinkActive="actif">Connexion</a>
      <a routerLink="/inscription" class="inscription">Inscription</a>
    </ng-template>
  </div>
</nav>

<router-outlet></router-outlet>
