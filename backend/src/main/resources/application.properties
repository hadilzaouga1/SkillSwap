server.port=8081
spring.application.name=skillswap-api

# Connexion à la base de données Docker
spring.datasource.url=jdbc:postgresql://localhost:5433/skillswap
spring.datasource.username=skillswap
spring.datasource.password=skillswap
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate valide le schéma (Flyway va le créer)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html