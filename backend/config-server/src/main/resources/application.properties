spring.application.name=config-server
server.port=8888

# Mode "native" : les fichiers de configuration sont lus dans le dossier config-repo/ (classpath).
# NB : on n'utilise volontairement pas "classpath:/config" car Spring Boot lit déjà ce dossier pour lui-même.
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=classpath:/config-repo

# Pour passer à un dépôt Git (plus réaliste en production), remplacer les 2 lignes ci-dessus par :
# spring.cloud.config.server.git.uri=https://github.com/hadilzaouga1/skillswap-config
# spring.cloud.config.server.git.default-label=main

management.endpoints.web.exposure.include=health,info
