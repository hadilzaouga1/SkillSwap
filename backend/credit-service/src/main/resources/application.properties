spring.application.name=credit-service
server.port=8086

# Connexion MySQL (une base PAR service, ENF14)
spring.datasource.url=${CREDIT_DB_URL:jdbc:mysql://localhost:3306/skillswap_credit?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${CREDIT_DB_USERNAME:root}
spring.datasource.password=${CREDIT_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# --- Règles métier ---
# Crédits offerts à la création du compte d'un étudiant (1 crédit = 1 heure)
skillswap.credits.welcome=3

# Clé partagée entre services pour les routes /internal/** (jamais exposées par la Gateway).
# Doit être identique dans exchange-service. En dehors du développement : variable INTERNAL_KEY.
skillswap.internal.key=${INTERNAL_KEY:dev-internal-key-change-me}
