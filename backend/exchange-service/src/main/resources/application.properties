spring.application.name=exchange-service
server.port=8082

# Connexion MySQL
spring.datasource.url=${EXCHANGE_DB_URL:jdbc:mysql://localhost:3306/skillswap_exchange?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${EXCHANGE_DB_USERNAME:root}
spring.datasource.password=${EXCHANGE_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Eureka
# eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

#on a changé le port du config server pour qu'il soit sur le même port que le eureka server
spring.config.import=optional:configserver:http://localhost:8888

# Clé partagée avec credit-service pour les routes /internal/** (variable INTERNAL_KEY hors développement)
skillswap.internal.key=${INTERNAL_KEY:dev-internal-key-change-me}
# Configuration Kafka Producer (JSON)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.spring.json.add.type.headers=false
skillswap.kafka.topics.exchange-status-changed=${KAFKA_TOPIC_EXCHANGE_STATUS:exchange.status.changed}
