spring.application.name=exchange-service
server.port=8082

# Connexion MySQL
spring.datasource.url=${EXCHANGE_DB_URL:jdbc:mysql://localhost:3306/skillswap_exchange?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${EXCHANGE_DB_USERNAME:root}
spring.datasource.password=${EXCHANGE_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/