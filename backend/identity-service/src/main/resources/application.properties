server.port=8081
spring.application.name=identity-service

# Connexion MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/skillswap_identity?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Eureka Client
#eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
spring.config.import=optional:configserver:http://localhost:8888

# Clé secrète pour signer les tokens JWT (doit faire au moins 32 caractères)
#skillswap.jwt.secret=MaSuperCleSecreteUltraLonguePourSkillSwap2026!
# Durée de validité du token en millisecondes (ici 24 heures)
#skillswap.jwt.expiration=86400000

#Delete the previous skillswap.jwt.secret and skillswap.jwt.expiration properties, as we are now using Keycloak for authentication.
skillswap.internal-key=${INTERNAL_KEY:dev-internal-key-change-me}