services:
  postgres:
    image: postgres:16-alpine
    container_name: skillswap-db
    environment:
      POSTGRES_DB: skillswap
      POSTGRES_USER: skillswap
      POSTGRES_PASSWORD: skillswap
    ports:
      - "5432:5432"
    volumes:
      - skillswap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillswap"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  skillswap_pgdata: